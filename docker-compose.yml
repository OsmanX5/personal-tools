# Production: runs the image that the deploy workflow built and pushed to
# ghcr.io. deploy/remote-deploy.sh joins this container to the network of the
# Caddy container already on the VM and adds the site to its Caddyfile.
# The deploy workflow writes .env (app secrets) and .deploy.env (IMAGE, APP_PORT).
services:
  app:
    image: ${IMAGE:?IMAGE is set by the deploy workflow}
    container_name: personal-tools-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${APP_PORT:-9500}
    expose:
      - "${APP_PORT:-9500}"
    # Localhost only: the public site goes through Caddy over HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-9500}:${APP_PORT:-9500}"
