<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Personal Tools</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #737373; --btn: #171717; --btn-fg: #fafafa; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1218; --fg: #fafafa; --muted: #a3a3a3; --btn: #3b82f6; --btn-fg: #fafafa; }
      }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg); font-family: Roboto, system-ui, sans-serif; text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 500; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      button { background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
      img { width: 64px; height: 64px; border-radius: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Personal Tools needs a connection to load your data.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
